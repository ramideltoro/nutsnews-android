name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate wrapper integrity
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

  verify:
    name: Compile, lint, test, and assemble
    needs: wrapper-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Validate CI workflow contract
        run: ./scripts/validate-android-ci.sh

      - name: Compile, lint, test, and assemble debug APK
        shell: bash
        run: |
          mkdir -p build-logs
          set -o pipefail
          ./gradlew \
            --stacktrace \
            --console=plain \
            compileDebugKotlin \
            lintDebug \
            testDebugUnitTest \
            assembleDebug \
            2>&1 | tee build-logs/android-ci.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-ci-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-logs/android-ci.log
            app/build/reports
            app/build/test-results
            app/build/outputs/logs
          if-no-files-found: ignore
          retention-days: 14
