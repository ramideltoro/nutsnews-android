name: Play Store Metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Play metadata
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate listing, assets, policies, and failure behavior
        run: ./scripts/tests/test-play-store-metadata.sh

  publish:
    name: Publish Play metadata
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: play-internal
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish and verify Internal Testing store listing
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing." >&2
            exit 1
          fi
          credential_dir="$(mktemp -d)"
          trap 'rm -rf "$credential_dir"' EXIT
          umask 077
          credential_path="$credential_dir/service-account.json"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" >"$credential_path"
          access_token="$(
            ./scripts/mint-google-play-access-token.sh "$credential_path"
          )"
          [[ -n "$access_token" ]] || {
            echo "Android Publisher token minting returned an empty token." >&2
            exit 1
          }
          GOOGLE_PLAY_ACCESS_TOKEN="$access_token" \
            ./scripts/publish-play-store-metadata.sh
