name: Security

on:
  workflow_call:
    inputs:
      run_protected_signing:
        description: Build and verify an AAB with protected upload-key secrets
        required: false
        type: boolean
        default: false
      run_play_verification:
        description: Verify protected service-account access to Play Internal
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_protected_signing:
        description: Build and verify an AAB with protected upload-key secrets
        required: false
        type: boolean
        default: true
      run_play_verification:
        description: Verify protected service-account access to Play Internal
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-protection:
    name: Branch protection policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate branch protection contract
        run: ./scripts/validate-branch-protection.sh

  release-signing-contract:
    name: Release signing contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Build and verify with ephemeral test signing
        shell: bash
        run: |
          ./scripts/validate-release-signing.sh
          signing_dir="$(mktemp -d)"
          trap 'rm -rf "$signing_dir"' EXIT
          umask 077
          store_password="$(openssl rand -hex 32)"
          key_password="$(openssl rand -hex 32)"
          key_alias="nutsnews-ci-test-upload"
          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"
          keytool -genkeypair \
            -keystore "$signing_dir/test-upload.jks" \
            -storetype JKS \
            -storepass "$store_password" \
            -keypass "$key_password" \
            -alias "$key_alias" \
            -keyalg RSA \
            -keysize 2048 \
            -sigalg SHA256withRSA \
            -validity 30 \
            -dname "CN=NutsNews CI Test Upload, O=NutsNews, C=US" \
            >/dev/null 2>&1
          NUTSNEWS_UPLOAD_KEYSTORE_PATH="$signing_dir/test-upload.jks" \
          NUTSNEWS_UPLOAD_KEYSTORE_PASSWORD="$store_password" \
          NUTSNEWS_UPLOAD_KEY_ALIAS="$key_alias" \
          NUTSNEWS_UPLOAD_KEY_PASSWORD="$key_password" \
            ./gradlew \
              --no-daemon \
              --no-configuration-cache \
              --dependency-verification=strict \
              --stacktrace \
              --console=plain \
              bundleRelease
          ./scripts/verify-release-bundle.sh \
            app/build/outputs/bundle/release/app-release.aab

  protected-release-signing:
    name: Protected release signing
    if: github.event_name == 'workflow_dispatch' && inputs.run_protected_signing == true
    needs:
      - release-signing-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-signing

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      - name: Build and verify with protected upload signing
        shell: bash
        env:
          NUTSNEWS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.NUTSNEWS_UPLOAD_KEYSTORE_BASE64 }}
          NUTSNEWS_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.NUTSNEWS_UPLOAD_KEYSTORE_PASSWORD }}
          NUTSNEWS_UPLOAD_KEY_ALIAS: ${{ secrets.NUTSNEWS_UPLOAD_KEY_ALIAS }}
          NUTSNEWS_UPLOAD_KEY_PASSWORD: ${{ secrets.NUTSNEWS_UPLOAD_KEY_PASSWORD }}
        run: |
          for required_value in \
            "$NUTSNEWS_UPLOAD_KEYSTORE_BASE64" \
            "$NUTSNEWS_UPLOAD_KEYSTORE_PASSWORD" \
            "$NUTSNEWS_UPLOAD_KEY_ALIAS" \
            "$NUTSNEWS_UPLOAD_KEY_PASSWORD"; do
            if [[ -z "$required_value" ]]; then
              echo "A protected release-signing secret is missing." >&2
              exit 1
            fi
          done
          signing_dir="$(mktemp -d)"
          trap 'rm -rf "$signing_dir"' EXIT
          umask 077
          printf '%s' "$NUTSNEWS_UPLOAD_KEYSTORE_BASE64" |
            base64 --decode >"$signing_dir/nutsnews-upload.jks"
          NUTSNEWS_UPLOAD_KEYSTORE_PATH="$signing_dir/nutsnews-upload.jks" \
            ./gradlew \
              --no-daemon \
              --no-configuration-cache \
              --dependency-verification=strict \
              --stacktrace \
              --console=plain \
              bundleRelease
          ./scripts/verify-release-bundle.sh \
            app/build/outputs/bundle/release/app-release.aab \
            config/signing/nutsnews-upload-certificate.pem

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-signed-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  play-provisioning-contract:
    name: Google Play provisioning contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Google Play provisioning contract
        run: ./scripts/validate-play-internal-provisioning.sh

  play-internal-access:
    name: Google Play internal access
    if: github.event_name == 'workflow_dispatch' && inputs.run_play_verification == true
    needs:
      - play-provisioning-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: play-internal

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify package and internal-track access
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing." >&2
            exit 1
          fi
          credential_dir="$(mktemp -d)"
          trap 'rm -rf "$credential_dir"' EXIT
          umask 077
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" \
            >"$credential_dir/service-account.json"
          ./scripts/verify-play-internal-access.sh \
            "$credential_dir/service-account.json"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: true
          vulnerability-check: true
          comment-summary-in-pr: never

  codeql:
    name: CodeQL (Java/Kotlin)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Validate security automation
        run: ./scripts/validate-security-automation.sh

      - name: Build analyzed sources with strict dependency verification
        run: |
          ./gradlew \
            --no-configuration-cache \
            --dependency-verification=strict \
            --stacktrace \
            --console=plain \
            clean \
            compileDebugKotlin \
            compileDebugAndroidTestKotlin

      - name: Analyze Java and Kotlin
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: /language:java-kotlin
